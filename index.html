<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ori & Coding - Ultra Gallery</title>
    <style>
        /* BASE DO SITE */
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #080c10;
            color: #f0f6fc;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* TOPO DO SITE COM EFEITO NEON */
        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5rem;
            color: #58a6ff;
            text-shadow: 0 0 15px rgba(88, 166, 255, 0.6);
            margin: 0 0 10px 0;
        }

        p {
            color: #8b949e;
            font-size: 1.1rem;
            margin: 0;
        }

        /* GRADE DA GALERIA */
        .galeria {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1100px;
        }

        /* CARTÕES DOS GIFS */
        .card-gif {
            background-color: #0d1117;
            border: 2px solid #21262d;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        /* Efeito de foco ao passar o mouse */
        .card-gif:hover {
            transform: translateY(-5px);
            border-color: #58a6ff;
            box-shadow: 0 8px 25px rgba(88, 166, 255, 0.2);
        }

        /* Container para manter os GIFs proporcionais */
        .gif-container {
            width: 100%;
            height: 220px;
            overflow: hidden;
            background-color: #161b22;
            position: relative;
        }

        .gif-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* TEXTOS E INTERAÇÃO DENTRO DO CARD */
        .card-info {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-grow: 1;
            justify-content: space-between;
        }

        .card-info span {
            font-size: 1.1rem;
            font-weight: 600;
            color: #f0f6fc;
        }

        /* BOTÃO INTERATIVO DE CURTIR */
        .btn-like {
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            align-self: flex-start;
        }

        .btn-like:hover {
            background-color: #f25c54;
            color: #ffffff;
            border-color: #f25c54;
        }

        .btn-like.liked {
            background-color: #e63946;
            color: white;
            border-color: #e63946;
            animation: pulse 0.3s linear;
        }

        @keyframes pulse {
            50% { transform: scale(1.15); }
        }

        /* RODAPÉ */
        footer {
            margin-top: 60px;
            color: #484f58;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Ori & Coding Workspace 🪐</h1>
        <p>Uma coleção viva de códigos, pixels e a magia de Nibel.</p>
    </header>

    <div class="galeria">
        
        <!-- CARD 1: ORI RUNNING -->
        <div class="card-gif">
            <div class="gif-container">
                <img src="https://tenor.com" alt="Ori correndo">
            </div>
            <div class="card-info">
                <span>Ori explorando a Floresta de Nibel</span>
                <button class="btn-like" onclick="curtir(this)">❤️ <span>0</span></button>
            </div>
        </div>

        <!-- CARD 2: CODING VIBES -->
        <div class="card-gif">
            <div class="gif-container">
                <img src="https://tenor.com" alt="Programador codando">
            </div>
            <div class="card-info">
                <span>Escrevendo scripts em C# na Unity</span>
                <button class="btn-like" onclick="curtir(this)">❤️ <span>0</span></button>
            </div>
        </div>

        <!-- CARD 3: ORI GAMEPLAY -->
        <div class="card-gif">
            <div class="gif-container">
                <img src="https://tenor.com" alt="Ori Gameplay">
            </div>
            <div class="card-info">
                <span>Cenários deslumbrantes da Moon Studios</span>
                <button class="btn-like" onclick="curtir(this)">❤️ <span>0</span></button>
            </div>
        </div>

        <!-- CARD 4: CODE SCREEN -->
        <div class="card-gif">
            <div class="gif-container">
                <img src="https://tenor.com" alt="Matrix Code">
            </div>
            <div class="card-info">
                <span>Compilando o jogo final sem erros</span>
                <button class="btn-like" onclick="curtir(this)">❤️ <span>0</span></button>
            </div>
        </div>

    </div>

    <footer>
        Desenvolvido por Luis Felipe Soares • Hospedado via GitHub Pages
    </footer>

    <!-- LÓGICA EM JAVASCRIPT PARA FAZER O SITE INTERAGIR -->
    <script>
        function curtir(botao) {
            botao.classList.toggle('liked');
            let contadorSpan = botao.querySelector('span');
            let curtidasAtuais = parseInt(contadorSpan.innerText);
            
            if(botao.classList.contains('liked')) {
                contadorSpan.innerText = curtidasAtuais + 1;
            } else {
                contadorSpan.innerText = curtidasAtuais - 1;
            }
        }
    </script>

</body>
</html>
